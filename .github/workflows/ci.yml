# Tests and a quick data build for pull requests and feature branches.
# The data build only covers Korea to keep the load on Overpass small; put
# "[full-data]" in a commit message to run the worldwide build instead, and
# "[import-chains]" to re-extract chain branches from the Korean store
# registry (kept as the "kr-chains" artifact for committing).
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Import chain branches (Korean store registry)
        if: ${{ contains(github.event.head_commit.message, '[import-chains]') }}
        run: node scripts/import-chains.mjs

      - name: Keep chain branches
        if: ${{ contains(github.event.head_commit.message, '[import-chains]') }}
        uses: actions/upload-artifact@v4
        with:
          name: kr-chains
          path: data/sources/kr-chains.json

      - name: Build data (Korea only)
        if: ${{ !contains(github.event.head_commit.message, '[full-data]') }}
        run: node scripts/build-data.mjs --korea-only --budget-min 15 --out _ci/data

      - name: Build data (worldwide)
        if: ${{ contains(github.event.head_commit.message, '[full-data]') }}
        run: node scripts/build-data.mjs --out _ci/data

      - name: Summarise data
        run: |
          node -e "
            const i = require('./_ci/data/index.json');
            console.log('mode', i.mode, 'osmBase', i.osmBase);
            console.log('overpass', JSON.stringify(i.overpass));
            console.log('stats', JSON.stringify(i.stats));
            console.log('cells', Object.keys(i.cells).length);
          "

      - name: Assemble site
        run: node scripts/assemble.mjs _ci/site https://example.github.io/Muslimfood/ --data _ci/data
