# Deploys the site to GitHub Pages. A push to main rebuilds the data from the
# last downloads and is live in about two minutes; the daily run refreshes
# OpenStreetMap and MUFKO (5-10 minutes, mostly waiting for the shared Overpass server)
# and the quarterly Korean store registry. One-time setup: Settings → Pages →
# Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every day at 04:17 KST (19:17 UTC): refresh OpenStreetMap and MUFKO.
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      # A push only changes the code: rebuild the data from the last downloads
      # and deploy within about two minutes. The daily run (and "Run workflow")
      # refreshes OpenStreetMap and picks up a new edition of the store registry.
      - name: Fast rebuild or full refresh
        id: mode
        run: echo "refresh=${{ github.event_name != 'push' }}" >> "$GITHUB_OUTPUT"

      # Chain branches come from Korea's national store registry: a 350 MB
      # archive with a new edition every quarter. The archive stays in the
      # cache and branches are re-extracted from it in about 30 seconds, so
      # adding a chain to brands.js does not need a new download.
      - name: Check the store registry edition
        id: stores
        run: echo "edition=$(node scripts/import-chains.mjs --modified || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Restore the store registry
        id: stores-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/stores.zip
          key: stores-${{ steps.stores.outputs.edition }}
          restore-keys: stores-

      - name: Download a new store registry edition
        id: stores-download
        if: steps.mode.outputs.refresh == 'true' && steps.stores.outputs.edition != 'unknown' && steps.stores-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: node scripts/import-chains.mjs --download-only .cache/stores.zip

      - name: Save the store registry
        if: steps.stores-download.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .cache/stores.zip
          key: stores-${{ steps.stores.outputs.edition }}

      - name: Extract chain branches
        if: hashFiles('.cache/stores.zip') != ''
        continue-on-error: true
        run: node scripts/import-chains.mjs --zip .cache/stores.zip

      # MUFKO fills gaps in OSM and the older Korean public lists. Pushes reuse
      # the latest successful snapshot; a failed refresh retains that snapshot.
      - name: Restore MUFKO directory
        uses: actions/cache/restore@v4
        with:
          path: .cache/mufko
          key: mufko-${{ github.run_id }}
          restore-keys: mufko-

      - name: Import MUFKO restaurants
        run: node scripts/import-mufko.mjs --cache .cache/mufko/restaurants.json ${{ steps.mode.outputs.refresh != 'true' && '--reuse' || '' }}

      - name: Save MUFKO directory
        uses: actions/cache/save@v4
        with:
          path: .cache/mufko
          key: mufko-${{ github.run_id }}

      # Keep the last good OpenStreetMap download: pushes reuse it, and a
      # temporary Overpass outage on the daily run does not remove places.
      - name: Restore previous OpenStreetMap download
        uses: actions/cache/restore@v4
        with:
          path: .cache/osm
          key: osm-${{ github.run_id }}
          restore-keys: osm-

      - name: Build data (OpenStreetMap + MUFKO + Korean public data)
        run: node scripts/build-data.mjs --osm-cache .cache/osm ${{ steps.mode.outputs.refresh != 'true' && '--osm-reuse' || '' }}

      - name: Save OpenStreetMap download
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/osm
          key: osm-${{ github.run_id }}

      - id: pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: node scripts/assemble.mjs _site "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
